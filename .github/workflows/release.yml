name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Compute version
        id: version
        run: echo "version=$(TZ=Asia/Taipei date +%Y%m%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          go tool make windows
          go tool make linux
          mkdir dist
          cp out/sshole.exe dist/sshole-windows-amd64.exe
          cp out/sshole dist/sshole-linux-amd64

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes
